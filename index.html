<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investment Guide</title>
<style>
/* ============================================================
   BathWorks Investment Guide - embedded price presentation
   Single self-contained file. No network requests. Works offline.

   Built on the BathWorks design system: navy is the brand, slate is
   the workhorse neutral, periwinkle is decoration only, cool neutrals
   throughout. No amber, no warm accents.

   Sizing is deliberately larger than the design system's web defaults.
   This is read across a kitchen table by homeowners who are often
   older, sometimes without reading glasses in hand.
   ============================================================ */

:root{
  /* Brand */
  --navy-900:#021A40;
  --navy-800:#032456;
  --navy-700:#0A3672;
  --slate-600:#535860;
  --periwinkle-500:#818BA6;
  --periwinkle-200:#D6DBE6;

  /* Cool neutrals */
  --cloud:#F7F9FC;
  --mist:#EDF1F7;
  --surface:#FFFFFF;
  --border:#DDE3EC;
  --border-strong:#C3CDDC;

  /* Status. Green reads as money saved and is the only non-navy hue. */
  --green-700:#0F7A45;

  /* Configurable, set from the config block at runtime */
  --btn:var(--navy-800);
  --credit:var(--green-700);

  /* Shape */
  --radius-md:10px;
  --radius-lg:14px;
  --radius-pill:999px;

  /* Layout knobs, all editable from Administrator -> Layout */
  --pk-gap-col:22px;
  --pk-gap-block:15px;
  --pk-radius:14px;
  --pk-pad:22px;
  --pk-amount:66px;
  --pk-title:35px;
  --pk-base:17px;
  --pk-page-title:15px;
  --pk-hdr-bg:transparent;
  --pk-hdr-border:transparent;
  --pk-hdr-text:var(--navy-800);
  --pk-heading-font:var(--font-serif);
  --pk-title-color:#032456;
  --pk-subtitle-color:#535860;

  /* Navy-tinted shadows, never neutral black */
  --shadow-sm:0 1px 2px rgba(3,36,86,.07), 0 1px 3px rgba(3,36,86,.06);
  --shadow-md:0 4px 14px rgba(3,36,86,.11);
  --shadow-lg:0 14px 36px rgba(3,36,86,.18);
  --shadow-focus:0 0 0 3px rgba(3,36,86,.45);

  /* Type. Source Serif 4 and Lato are the system's faces; this file
     loads nothing over the network, so both fall back to what is on
     the machine. Numbers stay in the sans on purpose: Georgia, the
     likely serif fallback, sets old-style figures that dip below the
     baseline and make prices harder to scan. */
  --font-serif:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
  --font-sans:"Lato","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;

  /* Motion: calm and quick, no overshoot */
  --dur-fast:130ms;
  --dur-base:200ms;
  --ease:cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  color:var(--navy-800);
  background:transparent;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body.bg-cloud{background:var(--cloud)}
body.bg-mist{background:var(--mist)}
body.bg-navy{background:var(--navy-800)}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--navy-800)}
:focus-visible{outline:none;box-shadow:var(--shadow-focus)}

.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

.app{display:flex;flex-direction:column;height:100%}

/* ---------- header ---------- */
.hdr{
  flex:0 0 auto;display:flex;align-items:center;gap:18px;
  padding:12px 22px;
  background:var(--pk-hdr-bg);
  border-bottom:1px solid var(--pk-hdr-border);
}
.hdr h1{font-family:var(--font-sans);font-size:var(--pk-page-title);font-weight:700;letter-spacing:.01em;white-space:nowrap;color:var(--pk-hdr-text);opacity:.85}
.hdr .logos{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;min-width:0}
.hdr .logos img{max-height:46px;max-width:42%;object-fit:contain}
/* The Jacuzzi script fills its frame edge to edge while the BathWorks mark
   carries its own margin, so matching their box heights makes Jacuzzi read
   oversized. Optical balance, not measured balance. */
.hdr .logos img.logo-secondary{max-height:37px}
.hdr .logos .wordmark{font-family:var(--font-serif);font-size:26px;font-weight:600;letter-spacing:-.015em;color:var(--pk-hdr-text)}
.hdr .logos .wordmark.alt{font-style:italic}
.hdr .logos .divider{width:1px;height:32px;background:var(--periwinkle-200)}

.btn-pricing{
  background:var(--btn);color:#fff;font-weight:700;font-size:18px;
  padding:13px 30px;border-radius:var(--radius-md);
  transition:background var(--dur-fast) var(--ease);
}
.btn-pricing:hover{background:var(--navy-700)}
.btn-more{
  width:48px;height:48px;border-radius:var(--radius-md);background:var(--mist);
  color:var(--navy-800);display:grid;place-items:center;font-size:22px;
  transition:background var(--dur-fast) var(--ease);
}
.btn-more:hover{background:var(--periwinkle-200)}

/* ---------- offers ---------- */
/* Each block is its own opaque card with soft edges, and the background
   photograph shows in the gutters between them. The board is only a
   layout wrapper: it carries no fill of its own. */
.stage{flex:1 1 auto;overflow:auto;padding:24px;display:flex}
.board{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.board.one,.board.focused{max-width:840px;margin:0 auto}
.grid{flex:1 1 auto;display:grid;gap:var(--pk-gap-col);align-items:stretch;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr))}
/* Focus mode: one offer, so give the number the room it just gained. */
.board.focused .offer .title{font-size:44px}
.board.focused .offer .subtitle{font-size:19px}
.board.focused .finance{padding:28px}
.board.focused .finance .amount{font-size:84px}
.board.focused .finance .amount .per{font-size:33px}
.board.focused .finance .flabel{font-size:19px}
.board.focused .lines .row .k,.board.focused .total .k{font-size:19px}
.board.focused .lines .row .v{font-size:28px}
.board.focused .total .v{font-size:46px}

.offer{position:relative;display:flex;flex-direction:column;gap:var(--pk-gap-block);min-width:0;height:100%}
.offer > .head{padding:0 2px}
/* Titles and subtitles are held to a single line each. "Scheduling Rewards"
   is the longest of the three, and if it wrapped, its navy panel would sit a
   line lower than the other two. The type scales down to fit rather than
   wrapping, so the panels stay level at any width. */
.offer .title{
  font-family:var(--pk-heading-font);font-size:clamp(17px,2.45vw,var(--pk-title));font-weight:600;
  letter-spacing:-.02em;line-height:1.06;color:var(--pk-title-color);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.offer .subtitle{
  font-size:clamp(11px,1.2vw,17px);font-weight:600;color:var(--pk-subtitle-color);
  margin-top:6px;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.panel{background:var(--surface);border-radius:var(--pk-radius);padding:var(--pk-pad);box-shadow:var(--shadow-sm)}
.offer .body{flex:1 1 auto;display:flex;flex-direction:column;gap:var(--pk-gap-block)}

/* Financing focal panel. Navy band, the highest-contrast element on
   the slide, because the payment is what the homeowner is here for. */
.finance{
  background:var(--navy-800);color:#fff;
  display:flex;flex-direction:column;box-shadow:var(--shadow-md);
}
.finance .promo{
  background:#fff;color:var(--navy-800);
  font-weight:700;font-size:15.5px;line-height:1.3;
  padding:10px 15px;border-radius:var(--radius-pill);
  margin-top:14px;text-align:center;
}
.finance .flabel{font-size:17px;font-weight:600;color:#C9D4E6}
.finance .amount{font-size:var(--pk-amount);font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:4px;color:#fff}
.finance .amount .per{font-size:27px;font-weight:600;letter-spacing:-.015em}
.finance .amount.text{font-size:34px;letter-spacing:-.02em;line-height:1.15}
.finance .plan{font-size:16px;font-weight:600;color:#C9D4E6;margin-top:10px;line-height:1.45}
.finance .plan.split{font-size:19px;color:#fff}
.finance .plan.split strong{font-weight:700}
.finance .financed{font-size:15px;font-weight:600;color:#C9D4E6;margin-top:11px}

.rule{height:1px;background:var(--border);margin:2px 0}
.breakdown{flex:1 1 auto;display:flex;flex-direction:column;border:1px solid var(--border);box-shadow:none}
.breakdown .rule{margin-top:auto}

.lines{display:flex;flex-direction:column;gap:11px}
.lines .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.lines .row .k{font-size:var(--pk-base);font-weight:600;color:var(--slate-600)}
.lines .row .v{font-size:25px;font-weight:700;letter-spacing:-.02em;color:var(--navy-800);white-space:nowrap}
.lines .row.credit .k{color:var(--credit);font-weight:700}
.lines .row.credit .v{color:var(--credit);font-size:23px}

.total{margin-top:16px}
.total .k{font-size:var(--pk-base);font-weight:600;color:var(--slate-600)}
.total .v{font-size:38px;font-weight:700;letter-spacing:-.025em;line-height:1.05;color:var(--navy-800);white-space:nowrap}
.save{font-size:16px;font-weight:700;color:var(--credit);margin-top:6px}

.costco{margin-top:14px;padding:14px 16px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--mist)}
.costco .k{font-size:14px;font-weight:600;color:var(--slate-600)}
.costco .v{font-size:24px;font-weight:700;color:var(--navy-800);letter-spacing:-.01em;margin-top:2px}
.costco .note{font-size:12px;font-weight:500;color:var(--slate-600);margin-top:6px;line-height:1.4}
.costco .final{margin-top:10px;padding-top:10px;border-top:1px solid var(--border-strong);display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.costco .final .k{font-size:14px;font-weight:700;color:var(--slate-600);margin-top:0}
.costco .final .v{font-size:22px;font-weight:700;color:var(--credit);margin-top:0;white-space:nowrap}

.offer .foot{margin-top:auto;display:flex;flex-direction:column;gap:11px}
.btn-fin{
  width:100%;background:var(--btn);color:#fff;font-weight:700;font-size:17px;
  padding:16px 14px;border-radius:var(--radius-md);
  transition:background var(--dur-fast) var(--ease);
}
.btn-fin:hover{background:var(--navy-700)}

/* Every column reserves this strip whether or not it has a button, so a
   column that has one is exactly as tall as a column that does not, and
   the cards line up. Quiet by design: the rep needs to find it, the
   homeowner does not need to notice it. */
.focus-row{display:flex;justify-content:flex-end;align-items:center;height:26px;flex:0 0 26px}
.btn-focus{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;
  color:rgba(83,88,96,.62);
  background:rgba(255,255,255,.55);border:1px solid rgba(3,36,86,.07);
  padding:0 10px;height:26px;border-radius:var(--radius-pill);line-height:1;
  transition:color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease);
}
.btn-focus:hover{color:var(--navy-800);background:#fff}
.btn-focus.on{color:#fff;background:var(--navy-800);border-color:var(--navy-800);font-size:12.5px;padding:0 13px}
.btn-focus.on:hover{background:var(--navy-700)}
.btn-focus .icon{width:12px;height:12px}

.empty-slot{
  border:2px dashed var(--periwinkle-200);border-radius:var(--radius-lg);
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:32px;color:var(--slate-600);font-weight:600;font-size:17px;line-height:1.6;min-height:240px;
}

/* ---------- pricing drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(2,26,64,.45);opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(420px,90vw);
  background:var(--cloud);box-shadow:var(--shadow-lg);
  transform:translateX(102%);transition:transform 320ms var(--ease);
  display:flex;flex-direction:column;z-index:20;
}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.drawer header h2{font-family:var(--font-serif);font-size:18px;font-weight:600;color:var(--navy-800)}
.drawer .scrollarea{flex:1;overflow:auto;padding:12px 16px 16px}
.drawer footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface)}

.grp{margin-top:13px}
.grp:first-child{margin-top:0}
.grp > .lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--slate-600);margin-bottom:5px}

.tog{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:8px 11px;margin-bottom:4px;cursor:pointer;
  transition:border-color var(--dur-fast) var(--ease);
}
.tog:hover{border-color:var(--border-strong)}
.tog .name{font-size:13.5px;font-weight:700;line-height:1.2;color:var(--navy-800)}
.tog .name small{display:block;font-size:11px;font-weight:600;color:var(--slate-600);margin-top:1px;line-height:1.3}
.sw{flex:0 0 auto;width:42px;height:24px;border-radius:var(--radius-pill);background:var(--periwinkle-200);position:relative;transition:background var(--dur-fast) var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform var(--dur-fast) var(--ease);box-shadow:var(--shadow-sm)}
.sw.on{background:var(--btn)}
.sw.on::after{transform:translateX(18px)}

.slider-row,.planpick{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 11px;margin-bottom:4px}
.slider-row .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.slider-row .top .name{font-size:13.5px;font-weight:700}
.slider-row .top .val{font-size:13.5px;font-weight:700;color:var(--btn)}
.slider-row input[type=range]{width:100%;accent-color:var(--btn)}
.planpick .name{font-size:13px;font-weight:700;margin-bottom:5px;color:var(--navy-800)}
.planpick select,.finance select{
  width:100%;padding:7px 9px;border:1px solid var(--border-strong);
  border-radius:8px;background:#fff;font-weight:600;font-size:12.5px;color:var(--navy-800);
}

.link-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--btn);padding:6px 2px}
.link-btn:hover{color:var(--navy-700);text-decoration:underline}
.ghost-btn{border:1px solid var(--btn);color:var(--btn);font-weight:700;font-size:13.5px;padding:9px 13px;border-radius:var(--radius-md);background:var(--surface)}
.ghost-btn:hover{background:var(--mist)}
.solid-btn{background:var(--btn);color:#fff;font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:var(--radius-md)}
.solid-btn:hover{background:var(--navy-700)}
.danger-btn{border:1px solid #B3261E;color:#B3261E;font-weight:700;font-size:12px;padding:5px 9px;border-radius:var(--radius-md);background:var(--surface)}
.danger-btn:hover{background:var(--mist)}
.x-btn{width:40px;height:40px;border-radius:var(--radius-md);background:var(--mist);color:var(--navy-800);display:grid;place-items:center;font-size:20px}
.x-btn:hover{background:var(--periwinkle-200)}
.x-btn .icon{width:20px;height:20px}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,26,64,.45)}
.modal.on{display:flex}
.modal .sheet{
  background:var(--cloud);border-radius:var(--radius-lg);width:100%;max-width:var(--mw,660px);
  max-height:92%;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.modal .sheet > header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border);background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.modal .sheet > header h2{font-family:var(--font-serif);font-size:18px;font-weight:600;color:var(--navy-800)}
.modal .sheet > .content{overflow:auto;padding:14px 18px}
.modal .sheet > footer{padding:11px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px;align-items:center;background:var(--surface);border-radius:0 0 var(--radius-lg) var(--radius-lg)}

.field{margin-bottom:16px}
.field label{display:block;font-size:16px;font-weight:700;margin-bottom:7px;color:var(--navy-800)}
.field .wrap{display:flex;align-items:center;background:#fff;border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:13px 15px;gap:9px}
.field .wrap:focus-within{border-color:var(--navy-800);box-shadow:var(--shadow-focus)}
.field .wrap .pre{font-weight:700;font-size:19px;color:var(--slate-600)}
.field .wrap input{border:none;outline:none;flex:1;font-size:21px;font-weight:700;background:transparent;min-width:0}
.totrow{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.totrow .k{font-size:16px;font-weight:600;color:var(--slate-600)}
.totrow .v{font-size:33px;font-weight:700;letter-spacing:-.025em;color:var(--navy-800)}

table.fin{width:100%;border-collapse:collapse;font-size:16px}
table.fin th{text-align:left;font-weight:700;padding:11px 9px;border-bottom:1px solid var(--border-strong);font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--slate-600)}
table.fin td{padding:14px 9px;border-bottom:1px solid var(--border);font-weight:600;color:var(--navy-800)}
table.fin tbody tr{cursor:pointer;transition:background var(--dur-fast) var(--ease)}
table.fin tbody tr:hover td{background:rgba(3,36,86,.045)}
table.fin tr.sel td{background:rgba(3,36,86,.075)}
table.fin tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--btn)}
table.fin tr.sel td{font-weight:700}
table.fin tbody tr:focus-visible{outline:none}
table.fin tbody tr:focus-visible td{background:rgba(3,36,86,.075)}
table.fin td.pay{font-weight:700;font-size:19px;white-space:nowrap}

/* ---------- admin ---------- */
.tabs{display:flex;gap:2px;background:var(--mist);border-radius:8px;padding:3px;margin-bottom:11px}
.tabs button{flex:1;padding:8px 6px;border-radius:6px;font-weight:700;font-size:13px;color:var(--slate-600)}
.tabs button.on{background:var(--surface);color:var(--navy-800);box-shadow:var(--shadow-sm)}
.tabpane{display:none}
.tabpane.on{display:block}

.editcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px;margin-bottom:8px}
.editcard .cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.editcard .cardhead strong{font-size:13.5px;color:var(--navy-800)}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.egrid label{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--slate-600);margin-bottom:3px;line-height:1.3}
.egrid input,.egrid select{width:100%;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-weight:600;font-size:12.5px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{border:1px solid var(--border-strong);background:#fff;border-radius:var(--radius-pill);padding:5px 11px;font-size:12px;font-weight:700;color:var(--slate-600)}
.chip:hover{border-color:var(--navy-800);color:var(--navy-800)}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.sit-note{
  background:#EAF3EE;border:1px solid #BFE0CC;color:#0B5B34;
  border-radius:8px;padding:7px 10px;margin-bottom:11px;
  font-size:11.5px;font-weight:700;line-height:1.4;
}
.hint{font-size:11.5px;color:var(--slate-600);font-weight:600;line-height:1.5;margin-top:5px}
.warn{background:var(--mist);border:1px solid var(--periwinkle-200);border-radius:8px;padding:9px 11px;font-size:11.5px;font-weight:600;line-height:1.5;margin-bottom:10px;color:var(--navy-800)}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.hidden{display:none !important}
.err{color:#B3261E;font-size:14.5px;font-weight:700;margin-top:9px}
.dirty-flag{
  margin-right:auto;color:#B3261E;font-size:11.5px;font-weight:700;line-height:1.4;
  background:#FBEDEC;border:1px solid #F0C9C6;border-radius:7px;padding:6px 9px;
}
#adminStatus:empty{display:none}
.solid-btn.pending{box-shadow:0 0 0 3px rgba(179,38,30,.30)}

@media (max-width:1000px){
  .finance .amount{font-size:min(var(--pk-amount),52px)}
  .lines .row .v{font-size:21px}
  .total .v{font-size:31px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>

<script>
"use strict";
/* Filled in by the last script in the body, once this whole file has been
   parsed. Export rewrites only the configuration block inside it. */
var PRISTINE_HTML = "";

(function () {

/* ============================================================
   1. Config load
   ============================================================ */
var RAW = document.getElementById("pk-config").textContent;
var DEFAULT_CONFIG = JSON.parse(
  RAW.replace("/*PK_CONFIG_START*/", "").replace("/*PK_CONFIG_END*/", "").trim()
);

/* Only faces that are already on a Windows tablet or an iPad. The file
   loads nothing over the network, so a web font would simply not arrive. */
var HEADING_FONTS = {
  serif: 'var(--font-serif)',
  sans: 'var(--font-sans)',
  georgia: 'Georgia, "Times New Roman", serif',
  times: '"Times New Roman", Times, serif',
  garamond: 'Garamond, "Palatino Linotype", "Book Antiqua", serif',
  segoe: '"Segoe UI", system-ui, sans-serif',
  arial: 'Arial, Helvetica, sans-serif',
  trebuchet: '"Trebuchet MS", "Segoe UI", sans-serif',
  verdana: 'Verdana, Geneva, sans-serif',
  tahoma: 'Tahoma, Geneva, sans-serif'
};

var CONFIG = clone(DEFAULT_CONFIG);   // live config
var DRAFT = null;                     // admin working copy

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function uid(p) { return p + "-" + Math.floor(Math.random() * 1e9).toString(36); }

/* ============================================================
   2. Session state (resets between customers, never exported)
   ============================================================ */
var S = {};
function resetSession() {
  S = { inputs: {}, deposit: 0, toggles: {}, marketing: 0, shown: {}, plan: {}, focus: null, costco: false };
  CONFIG.priceInputs.forEach(function (pi) { S.inputs[pi.id] = 0; });
  CONFIG.discounts.forEach(function (d) { S.toggles[d.id] = !!d.defaultOn; });
  CONFIG.discounts.forEach(function (d) { if (d.repAdjustable) S.marketing = 0; });
  CONFIG.offers.forEach(function (o) {
    S.shown[o.id] = !!o.showByDefault;
    S.plan[o.id] = o.defaultPlan || (o.plans[0] || null);
  });
}
function findDiscount(id) {
  for (var i = 0; i < CONFIG.discounts.length; i++) if (CONFIG.discounts[i].id === id) return CONFIG.discounts[i];
  return null;
}
function findPlan(id) {
  for (var i = 0; i < CONFIG.financing.plans.length; i++) if (CONFIG.financing.plans[i].id === id) return CONFIG.financing.plans[i];
  return null;
}
/* The name a homeowner sees. Falls back to the internal plan name. */
function publicName(p) {
  return (p && p.publicTitle && p.publicTitle.trim()) ? p.publicTitle.trim() : (p ? p.title : "");
}
function payText(pay) {
  if (pay.kind === "amount") return money(pay.value) + "/mo";
  if (pay.kind === "split") return money(pay.value) + " now, then " + money(pay.remainder);
  if (pay.kind === "text") return pay.text;
  return "";
}

/* ============================================================
   3. Money + math
   Progressive stacking: percentage discounts apply to the running
   subtotal; cash discounts are flat. Deposit reduces the amount
   financed only, never the project total. This reproduces the
   Ingage PriceKit results exactly.
   ============================================================ */
/* ============================================================
   Appearance kept on this device

   Publishing to every rep means replacing the file in Ingage; there is no
   way around that without a network. But an admin nudging text sizes should
   not have to publish on every nudge. Appearance saves to this one machine,
   so you can iterate freely and produce a package only when you actually
   want the field to see it.

   Scoped to appearance on purpose. Prices, discounts and financing always
   come from the file, so no device can quietly quote different numbers.
   ============================================================ */
var LAYOUT_KEY = "bw-investment-guide-layout";

function saveLayoutLocal() {
  try {
    localStorage.setItem(LAYOUT_KEY, JSON.stringify({ v: 1, layout: CONFIG.layout }));
    return true;
  } catch (e) { return false; }
}
function clearLayoutLocal() {
  try { localStorage.removeItem(LAYOUT_KEY); } catch (e) {}
}
function hasLayoutLocal() {
  try { return !!localStorage.getItem(LAYOUT_KEY); } catch (e) { return false; }
}
function loadLayoutLocal() {
  var raw = null;
  try { raw = localStorage.getItem(LAYOUT_KEY); } catch (e) { return false; }
  if (!raw) return false;
  var saved;
  try { saved = JSON.parse(raw); } catch (e) { clearLayoutLocal(); return false; }
  if (!saved || saved.v !== 1 || !saved.layout) { clearLayoutLocal(); return false; }
  /* The file stays the base, so anything new in a fresh build still arrives. */
  var base = CONFIG.layout || {};
  Object.keys(saved.layout).forEach(function (k) { base[k] = saved.layout[k]; });
  CONFIG.layout = base;
  return true;
}

/* ============================================================
   Sit memory

   Ingage tears the page down when the rep leaves the slide, so without
   this the quote is gone the moment they step back to a product page
   mid-negotiation. What gets remembered is the sit, never the setup:
   entered prices, which qualifiers are on, the chosen plans, which
   offers are revealed. The configuration itself still lives in the file.

   Deliberately device-local and short-lived. It is discarded when the rep
   presses "Reset for next customer", when the file's offers or discounts
   no longer match what was saved, and after a few hours, so a stale quote
   cannot surface in front of the wrong homeowner.
   ============================================================ */
var SESSION_KEY = "bw-investment-guide-sit";

function sitMemoryOn() {
  return !CONFIG.session || CONFIG.session.rememberDuringSit !== false;
}
function sitWindowMs() {
  var m = (CONFIG.session && Number(CONFIG.session.restoreWindowMinutes)) || 360;
  return m * 60000;
}
/* If the deck is re-exported with different offers or discounts, an old
   saved sit no longer describes anything real. */
function sitFingerprint() {
  return [
    CONFIG.offers.map(function (o) { return o.id; }).join(","),
    CONFIG.discounts.map(function (d) { return d.id; }).join(","),
    CONFIG.priceInputs.map(function (i) { return i.id; }).join(",")
  ].join("|");
}

function saveSit() {
  if (!sitMemoryOn()) return;
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      v: 1, at: Date.now(), fp: sitFingerprint(), s: S
    }));
  } catch (e) {
    /* Some webviews refuse storage. The sit still works, it just will not
       survive leaving the slide. Nothing here breaks because of it. */
  }
}

function clearSit() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

function loadSit() {
  if (!sitMemoryOn()) return false;
  var raw = null;
  try { raw = localStorage.getItem(SESSION_KEY); } catch (e) { return false; }
  if (!raw) return false;
  var saved;
  try { saved = JSON.parse(raw); } catch (e) { clearSit(); return false; }
  if (!saved || saved.v !== 1) { clearSit(); return false; }
  if (saved.fp !== sitFingerprint()) { clearSit(); return false; }
  if (!saved.at || (Date.now() - saved.at) > sitWindowMs()) { clearSit(); return false; }

  var got = saved.s || {};
  Object.keys(S).forEach(function (k) {
    if (got[k] !== undefined && got[k] !== null) S[k] = got[k];
  });
  S.restoredAt = saved.at;
  return true;
}

function money(n) {
  var neg = n < 0;
  var s = "$" + Math.abs(Math.round(n)).toLocaleString("en-US");
  return neg ? "-" + s : s;
}

function baseTotal() {
  var t = 0;
  CONFIG.priceInputs.forEach(function (pi) { if (pi.enabled) t += Number(S.inputs[pi.id] || 0); });
  return t;
}

/* Some price inputs are not Jacuzzi product (a non-Jacuzzi glass door, for
   instance) and Costco's shop card cannot be figured on them, since Costco
   and Jacuzzi's partnership does not extend to that spend. */
function costcoEligibleBaseTotal() {
  var t = 0;
  CONFIG.priceInputs.forEach(function (pi) {
    if (pi.enabled && pi.costcoEligible !== false) t += Number(S.inputs[pi.id] || 0);
  });
  return t;
}

function priceInputFor(id) {
  for (var i = 0; i < CONFIG.priceInputs.length; i++) if (CONFIG.priceInputs[i].id === id) return CONFIG.priceInputs[i];
  return null;
}

function discountAmount(d, running) {
  var basis = d.target === "TOTAL" ? running : Number(S.inputs[d.target] || 0);
  var val = d.repAdjustable ? Number(S.marketing || 0) : Number(d.value || 0);
  if (d.mode === "PERCENTAGE") return basis * (val / 100);
  return val;
}

function computeOffer(offer) {
  var base = baseTotal();
  var running = base;
  /* Tracked in parallel, dollar for dollar, so a non-Jacuzzi item (a glass
     door Costco and Jacuzzi's partnership does not cover) neither soaks up
     discount meant for it nor donates discount to the Jacuzzi materials.
     A TOTAL discount is split across the two in whatever ratio currently
     holds; a discount aimed at one specific price input passes straight
     through to costcoRunning only when that input is itself eligible. */
  var costcoRunning = costcoEligibleBaseTotal();
  var lines = [];

  var costcoActive = !!(S.costco && CONFIG.costco && CONFIG.costco.enabled);

  offer.discounts.forEach(function (did) {
    var d = findDiscount(did);
    if (!d) return;
    /* A Costco member gets the shop card instead of this one promotion
       (Soak Up Savings, by default), wherever it would otherwise apply,
       so it never stacks with it. */
    if (costcoActive && CONFIG.costco.replacesDiscountId && d.id === CONFIG.costco.replacesDiscountId) return;
    if (d.repToggleable && !S.toggles[d.id]) return;
    if (!d.repToggleable && d.defaultOn === false && !S.toggles[d.id]) return;

    var amt = discountAmount(d, running);
    var delta = (d.method === "ADD" ? amt : -amt);

    if (d.target === "TOTAL") {
      var share = running !== 0 ? (costcoRunning / running) : 0;
      costcoRunning += delta * share;
    } else {
      var pi = priceInputFor(d.target);
      if (pi && pi.enabled && pi.costcoEligible !== false) costcoRunning += delta;
    }

    running += delta;
    lines.push({ name: d.name, amount: amt, method: d.method });
  });

  // Optional cap on cumulative discount
  if (CONFIG.limits.maxTotalDiscountEnabled && base > 0) {
    var floor = base * (1 - Number(CONFIG.limits.maxTotalDiscountPercent || 0) / 100);
    if (running < floor) {
      var scale = running !== 0 ? floor / running : 0;
      costcoRunning *= scale;
      running = floor;
    }
  }
  if (running < 0) running = 0;
  if (costcoRunning < 0) costcoRunning = 0;
  if (costcoRunning > running) costcoRunning = running; // guards float drift, never more eligible than total

  var deposit = Math.min(Number(S.deposit || 0), running);
  return {
    base: base,
    lines: lines,
    total: running,
    costcoTotal: costcoRunning,
    saved: base - running,
    deposit: deposit,
    financed: Math.max(running - deposit, 0)
  };
}

/* Costco Shop Card: a member incentive, not a discount, so it never
   touches `running` above. It is 10% of labor and materials pre-tax,
   figured last, against whatever total an offer already landed on after
   every other discount.

   The materials/labor split is a share of that final, tax-included total,
   not of the pre-tax subtotal: labor is 20% of the total, untaxed, and
   materials is the other 80% of the total, WITH its own tax already baked
   in (this matches Costco's own materials invoice, which is separate from
   Bathworks' labor charge). Only the materials share was ever taxed, at
   6%, so it is knocked back down by the tax rate to get its pre-tax
   value before the two shares are added back together. Verified to the
   penny against three real contracts. */
function costcoShopCard(total) {
  var cfg = CONFIG.costco;
  if (!cfg || !cfg.enabled || total <= 0) return 0;
  var materialsShare = Number(cfg.materialsPercent || 0) / 100;
  var laborShare = 1 - materialsShare;
  var taxRate = Number(cfg.taxRatePercent || 0) / 100;
  var cardRate = Number(cfg.shopCardPercent || 0) / 100;
  var pretaxSubtotal = total * (laborShare + materialsShare * (1 - taxRate));
  return pretaxSubtotal * cardRate;
}

/* `res` is the result of computeOffer. A plan may require its own minimum
   down payment; whatever the homeowner puts down wins if it is larger. */
function payment(plan, res) {
  if (!plan) return { kind: "none", down: 0 };

  if (plan.method === "CUSTOM_VALUE") {
    return plan.custom ? { kind: "text", text: plan.custom, down: res.deposit } : { kind: "none", down: 0 };
  }

  /* A split is half of the price, full stop. It ignores the down payment,
     because paying half at signing and putting money down are the same act. */
  if (plan.method === "PERCENT_OF_TOTAL") {
    var due = res.total * (Number(plan.percent || 0) / 100);
    return { kind: "split", value: due, remainder: Math.max(res.total - due, 0), down: 0 };
  }

  var required = res.total * (Number(plan.downPercent || 0) / 100);
  var down = Math.min(Math.max(res.deposit, required), res.total);
  var principal = res.total - down;

  if (plan.method === "PAYMENT_FACTOR") {
    var f = Number(plan.factor || 0);
    if (f <= 0) return plan.custom ? { kind: "text", text: plan.custom, down: down } : { kind: "amount", value: 0, down: down };
    return { kind: "amount", value: principal * f, down: down, financed: principal };
  }

  // TERM_AND_INTEREST_RATE, and PROMO_THEN_TERM once the promo months are over
  var n = Number(plan.term || 0);
  var out = { kind: "amount", value: 0, down: down, financed: principal };
  if (plan.method === "PROMO_THEN_TERM") {
    out.promo = plan.promoLabel || (plan.promoMonths + " Months No Payments, No Interest");
    /* The longer promotions land at a rate we deliberately do not quote. They
       are sold to people who clear the balance before interest starts, so
       putting that rate into a monthly figure would misrepresent the offer. */
    if (plan.showPostPromoPayment === false) return out;
  }
  if (principal <= 0 || n <= 0) return out;
  var r = Number(plan.rate || 0) / 100 / 12;
  out.value = (r === 0) ? principal / n : principal * r / (1 - Math.pow(1 + r, -n));
  return out;
}

/* ============================================================
   4. Rendering
   ============================================================ */
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* ============================================================
   Text styling registry

   Every piece of text a homeowner reads is listed here once, with the
   selector that targets it and what may be adjusted. Administrator then
   needs one dropdown rather than a row per property, and adding a new
   adjustable element means adding a line here.
   ============================================================ */

];

var TEXT_ELEMENTS = [
  { key: "pageTitle",     label: "Page title \u2014 Investment Guide",         sel: ".hdr h1",

function textElement(key) {
  for (var i = 0; i < TEXT_ELEMENTS.length; i++) if (TEXT_ELEMENTS[i].key === key) return TEXT_ELEMENTS[i];
  return null;
}
/* The saved value where there is one, otherwise the built-in default. */
function textStyle(key, cfg) {
  var e = textElement(key);
  if (!e) return {};
  var src = cfg || CONFIG;
  var saved = (src.layout && src.layout.elements && src.layout.elements[key]) || {};
  return {
    size:   saved.size   !== undefined ? saved.size : e.def.size,
    color:  saved.color  !== undefined ? saved.color : e.def.color,
    weight: saved.weight !== undefined ? String(saved.weight) : e.def.weight,
    font:   saved.font   !== undefined ? saved.font : e.def.font
  };
}

function applyElementStyles() {
  var css = "";
  TEXT_ELEMENTS.forEach(function (e) {
    var v = textStyle(e.key);
    /* Titles keep shrinking rather than wrapping, so the payment panels stay
       level across columns. The chosen size becomes the ceiling. */
    var fs = e.clamp
      ? "clamp(" + e.clamp[0] + "px," + e.clamp[1] + "vw," + v.size + "px)"
      : v.size + "px";
    css += e.sel + "{font-size:" + fs + ";color:" + v.color +
      ";font-weight:" + v.weight + ";font-family:" + (FONT_STACKS[v.font] || FONT_STACKS.sans) + "}\n";
  });
  var tag = document.getElementById("pk-element-css");
  if (!tag) {
    tag = document.createElement("style");
    tag.id = "pk-element-css";
    document.head.appendChild(tag);
  }
  tag.textContent = css;
}

/* Older files stored a few sizes and colours as their own keys. Fold them
   into the element map once, so there is one system rather than two. */
function migrateLayout(L) {
  if (!L) return;
  if (!L.elements) L.elements = {};
  function move(oldKey, elKey, prop) {
    if (L[oldKey] === undefined || L[oldKey] === null) return;
    if (!L.elements[elKey]) L.elements[elKey] = {};
    if (L.elements[elKey][prop] === undefined) L.elements[elKey][prop] = L[oldKey];
    delete L[oldKey];
  }
  move("pageTitleSize", "pageTitle", "size");
  move("titleSize", "offerTitle", "size");
  move("paymentSize", "paymentAmount", "size");
  move("titleColor", "offerTitle", "color");
  move("subtitleColor", "offerSubtitle", "color");
  if (L.baseSize !== undefined && L.baseSize !== null) {
    ["lineLabel", "totalLabel", "offerSubtitle"].forEach(function (k) {
      if (!L.elements[k]) L.elements[k] = {};
      if (L.elements[k].size === undefined) L.elements[k].size = L.baseSize;
    });
    delete L.baseSize;
  }
  if (L.headingFont !== undefined && L.headingFont !== null) {
    ["pageTitle", "offerTitle"].forEach(function (k) {
      if (!L.elements[k]) L.elements[k] = {};
      if (L.elements[k].font === undefined) L.elements[k].font = L.headingFont;
    });
    delete L.headingFont;
  }
}

function applyTheme() {
  document.documentElement.style.setProperty("--btn", CONFIG.branding.button);
  document.documentElement.style.setProperty("--credit", CONFIG.branding.credit);
  document.body.className = "";
  var bd = CONFIG.page.backdrop;
  if (bd && bd !== "transparent") document.body.classList.add("bg-" + bd);

  /* Layout is data, not code, so it survives an export and can be changed
     without opening the file. Custom CSS is the escape hatch for anything
     the named controls do not cover. */
  migrateLayout(CONFIG.layout);
  applyElementStyles();
  var L = CONFIG.layout || {};
  var rs = document.documentElement.style;
  var px = function (v, d) { return (v === undefined || v === null || v === "" ? d : v) + "px"; };
  rs.setProperty("--pk-amount", px(L.paymentSize, 66));
  rs.setProperty("--pk-title", px(L.titleSize, 35));
  rs.setProperty("--pk-base", px(L.baseSize, 17));
  rs.setProperty("--pk-radius", px(L.cardRadius, 14));
  rs.setProperty("--pk-pad", px(L.cardPadding, 22));
  rs.setProperty("--pk-gap-block", px(L.gapBetweenCards, 15));
  rs.setProperty("--pk-gap-col", px(L.gapBetweenColumns, 22));
  rs.setProperty("--pk-page-title", px(L.pageTitleSize, 15));

  /* The page itself carries no fill by default, so whatever sits behind it
     in Ingage shows through untouched. Only the pricing cards are opaque. */
  var hb = L.headerBackground || "transparent";
  rs.setProperty("--pk-hdr-bg", hb === "white" ? "#ffffff" : hb === "navy" ? "var(--navy-800)" : "transparent");
  rs.setProperty("--pk-hdr-border", hb === "white" ? "var(--border)" : "transparent");
  rs.setProperty("--pk-hdr-text", hb === "navy" ? "#ffffff" : "var(--navy-800)");
  rs.setProperty("--pk-heading-font", HEADING_FONTS[L.headingFont] || HEADING_FONTS.serif);
  rs.setProperty("--pk-title-color", L.titleColor || "#032456");
  rs.setProperty("--pk-subtitle-color", L.subtitleColor || "#535860");

  var cs = document.getElementById("pk-custom-css");
  if (!cs) {
    cs = document.createElement("style");
    cs.id = "pk-custom-css";
    document.head.appendChild(cs);
  }
  cs.textContent = L.customCss || "";

  var bgi = CONFIG.branding.backgroundImage;
  if (bgi) {
    document.body.style.backgroundImage = "url(" + bgi + ")";
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
    document.body.style.backgroundRepeat = "no-repeat";
  } else {
    document.body.style.backgroundImage = "";
  }
  $("pageTitle").textContent = CONFIG.page.title;

  var L = $("logos");
  L.innerHTML = "";
  var b = CONFIG.branding;
  if (b.logoPrimary) { var i1 = el("img"); i1.src = b.logoPrimary; L.appendChild(i1); }
  else if (b.wordmarkPrimary) L.appendChild(el("div", "wordmark", esc(b.wordmarkPrimary)));
  if ((b.logoPrimary || b.wordmarkPrimary) && (b.logoSecondary || b.wordmarkSecondary)) L.appendChild(el("div", "divider"));
  if (b.logoSecondary) { var i2 = el("img", "logo-secondary"); i2.src = b.logoSecondary; L.appendChild(i2); }
  else if (b.wordmarkSecondary) L.appendChild(el("div", "wordmark alt", esc(b.wordmarkSecondary)));
}

/* Everything the rep has revealed. */
function shownOffers() {
  return CONFIG.offers.filter(function (o) { return S.shown[o.id]; });
}
/* What is actually on screen. Focus mode narrows it to a single column
   so the homeowner is looking at one number, not three. */
function visibleOffers() {
  var shown = shownOffers();
  if (S.focus) {
    var only = shown.filter(function (o) { return o.id === S.focus; });
    if (only.length) return only;
    S.focus = null;
  }
  return shown;
}

function renderStage() {
  var grid = $("grid"), board = $("board");
  grid.innerHTML = "";
  var offers = visibleOffers();
  grid.style.setProperty("--cols", Math.max(offers.length, 1));
  board.classList.toggle("one", offers.length === 1 && !S.focus);
  board.classList.toggle("focused", !!S.focus);
  saveSit();

  if (!offers.length) {
    grid.appendChild(el("div", "empty-slot", "No offers are showing.<br>Open <strong>Pricing</strong> to reveal one."));
    return;
  }
  offers.forEach(function (o) { grid.appendChild(renderOffer(o)); });
  equalizeFinance();
}

/* A promo badge, a down-payment line or a split-payment line makes one navy
   panel taller than its neighbours. Rather than reserve space for each of
   those cases separately, measure the tallest panel after a render and pad
   the rest up to it. Every blue block then starts and ends on the same line
   whatever combination of plans the rep has chosen. */
function equalizeFinance() {
  var panels = [].slice.call(document.querySelectorAll(".offer .finance"));
  panels.forEach(function (el) { el.style.minHeight = ""; });
  if (panels.length < 2) return;
  var tallest = 0;
  panels.forEach(function (el) {
    var h = el.getBoundingClientRect().height;
    if (h > tallest) tallest = h;
  });
  panels.forEach(function (el) { el.style.minHeight = Math.ceil(tallest) + "px"; });
}

var equalizePending = false;
window.addEventListener("resize", function () {
  if (equalizePending) return;
  equalizePending = true;
  requestAnimationFrame(function () { equalizePending = false; equalizeFinance(); });
});

function renderOffer(offer) {
  var r = computeOffer(offer);
  var plan = findPlan(S.plan[offer.id]);
  var pay = payment(plan, r);

  var wrap = el("div", "offer");

  var head = el("div", "head");
  head.appendChild(el("div", "title", esc(offer.title)));
  if (offer.subtitle) head.appendChild(el("div", "subtitle", esc(offer.subtitle)));
  wrap.appendChild(head);

  var body = el("div", "body");

  /* --- financing focal panel (sits above the total, by design) --- */
  var fp = el("div", "panel finance");
  if (pay.kind === "amount") {
    fp.appendChild(el("div", "flabel", esc((plan && plan.headlineLabel) || "Payment as low as")));
    fp.appendChild(el("div", "amount", money(pay.value) + '<span class="per">/month</span>'));
  } else if (pay.kind === "split") {
    fp.appendChild(el("div", "flabel", esc(plan.headlineLabel || "Due at signing")));
    fp.appendChild(el("div", "amount", money(pay.value)));
  } else if (pay.kind === "text") {
    fp.appendChild(el("div", "flabel", "Your payment"));
    fp.appendChild(el("div", "amount text", esc(pay.text)));
  } else {
    fp.appendChild(el("div", "flabel", "Payment terms"));
    fp.appendChild(el("div", "amount text", esc(plan ? plan.title : "Select a plan")));
  }
  /* Below the payment, never above it. A badge above would push the
     monthly figure down and it would no longer line up across columns. */
  if (pay.promo) fp.appendChild(el("div", "promo", esc(pay.promo)));

  if (plan && pay.kind === "amount") {
    // Never the term or the rate: the homeowner is not quoted a specific
    // lender's plan, only the payment they could reach. The badge already
    // names a promo plan, so it does not repeat here.
    var desc = pay.promo ? "" : publicName(plan);
    if (desc && desc.toLowerCase() !== "payment as low as") fp.appendChild(el("div", "plan", esc(desc)));
  } else if (plan && pay.kind === "split") {
    fp.appendChild(el("div", "plan split",
      "then <strong>" + money(pay.remainder) + "</strong> " + esc(plan.remainderLabel || "upon completion")));
  } else if (plan && pay.kind === "text") {
    fp.appendChild(el("div", "plan", esc(publicName(plan))));
  }

  if (pay.down > 0) {
    fp.appendChild(el("div", "financed",
      "with " + money(pay.down) + " " + esc(CONFIG.page.priceAdjustmentLabel.toLowerCase())));
  }
  /* --- price breakdown --- */
  var bp = el("div", "panel breakdown");
  var lines = el("div", "lines");

  var row0 = el("div", "row");
  row0.appendChild(el("div", "k", esc(offer.totalLabel)));
  row0.appendChild(el("div", "v", money(r.base)));
  lines.appendChild(row0);

  r.lines.forEach(function (L) {
    var row = el("div", "row credit");
    row.appendChild(el("div", "k", esc(L.name)));
    row.appendChild(el("div", "v", (L.method === "ADD" ? "+ " : "- ") + money(L.amount)));
    lines.appendChild(row);
  });
  bp.appendChild(lines);

  bp.appendChild(el("div", "rule"));

  var tot = el("div", "total");
  tot.appendChild(el("div", "k", esc(offer.title)));
  tot.appendChild(el("div", "v", money(r.total)));
  if (offer.showYouSave && r.saved > 0) tot.appendChild(el("div", "save", "You Save " + money(r.saved)));
  bp.appendChild(tot);

  if (offer.costcoEligible && S.costco) {
    var ccAmount = costcoShopCard(r.costcoTotal);
    if (ccAmount > 0) {
      var cbox = el("div", "costco");
      cbox.appendChild(el("div", "k", esc((CONFIG.costco && CONFIG.costco.lineLabel) || "Costco Shop Card")));
      cbox.appendChild(el("div", "v", money(ccAmount)));
      if (CONFIG.costco && CONFIG.costco.noteText) cbox.appendChild(el("div", "note", esc(CONFIG.costco.noteText)));
      /* The shop card is not a price cut on the contract itself, but the
         homeowner still nets it against their cost, so it earns its own
         "what this really comes to" line under the incentive amount. */
      var frow = el("div", "final");
      frow.appendChild(el("div", "k", esc((CONFIG.costco && CONFIG.costco.finalTotalLabel) || "Final Project Total")));
      frow.appendChild(el("div", "v", money(Math.max(r.total - ccAmount, 0))));
      cbox.appendChild(frow);
      bp.appendChild(cbox);
    }
  }
  /* Payment above the breakdown by default, which is what makes it the
     focal point. Administrator can put it below instead. */
  if ((CONFIG.layout && CONFIG.layout.paymentPosition) === "bottom") {
    body.appendChild(bp);
    body.appendChild(fp);
  } else {
    body.appendChild(fp);
    body.appendChild(bp);
  }

  wrap.appendChild(body);

  /* --- footer button --- */
  var foot = el("div", "foot");
  var btn = el("button", "btn-fin", esc(offer.financingButtonTitle));
  btn.addEventListener("click", function () { openFinancing(offer); });
  foot.appendChild(btn);

  /* Bottom right of the column: narrow the slide to this offer alone,
     and the same spot brings the other columns back. The strip is rendered
     in every column, empty where there is no button, so all the columns
     finish at the same height. */
  var row = el("div", "focus-row");
  foot.appendChild(row);
  if (offer.focusable !== false && (S.focus || shownOffers().length > 1)) {
    var fb;
    if (S.focus === offer.id) {
      fb = el("button", "btn-focus on",
        '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
        "<span>Return to standard pricing</span>");
      fb.addEventListener("click", function () { S.focus = null; renderStage(); });
    } else {
      fb = el("button", "btn-focus", "<span>" + esc(offer.focusLabel || "Show only this pricing") + "</span>");
      fb.addEventListener("click", function () { S.focus = offer.id; renderStage(); });
    }
    row.appendChild(fb);
  }
  wrap.appendChild(foot);

  return wrap;
}

/* ============================================================
   5. Financing table
   ============================================================ */
function openFinancing(offer) {
  var r = computeOffer(offer);
  $("finTitle").textContent = offer.title + " — " + offer.financingButtonTitle;

  var box = $("finBody");
  box.innerHTML = "";
  var lbl = CONFIG.page.priceAdjustmentLabel.toLowerCase();
  var ownDown = offer.plans.some(function (pid) {
    var p = findPlan(pid);
    return p && Number(p.downPercent || 0) > 0 && r.total * (p.downPercent / 100) > r.deposit;
  });
  box.appendChild(el("div", "hint",
    money(r.total) + " " + esc(offer.title) +
    (r.deposit > 0 ? ", with " + money(r.deposit) + " " + esc(lbl) : "") + "." +
    (ownDown ? " Some plans ask for a larger " + esc(lbl) + "." : "")));

  var F = CONFIG.financing;

  /* Two plans can carry the same customer-facing name — three of the term
     plans are all called "Payment as low as". With the term and rate hidden
     those rows would be indistinguishable, so only the best payment under a
     given name is listed. Give plans distinct public names to list them all. */
  var rows = [];
  var byName = {};
  offer.plans.forEach(function (pid) {
    var p = findPlan(pid);
    if (!p) return;
    var pay = payment(p, r);
    var name = publicName(p);
    var entry = { plan: p, pay: pay, name: name };
    var collapse = !F.showTerm && !F.showRate;
    if (collapse && byName[name]) {
      var prev = byName[name];
      var selId = S.plan[offer.id];
      if (prev.plan.id === selId) return;                        // already the one on the card
      if (p.id === selId) { prev.plan = p; prev.pay = pay; return; }
      var a = (pay.kind === "amount") ? pay.value : null;
      var b = (prev.pay.kind === "amount") ? prev.pay.value : null;
      if (a !== null && b !== null && a < b) { prev.plan = p; prev.pay = pay; }
      return;
    }
    byName[name] = entry;
    rows.push(entry);
  });

  var t = el("table", "fin");
  var head = "<tr><th>Plan</th>";
  if (F.showTerm) head += "<th>Months</th>";
  if (F.showRate) head += "<th>Rate</th>";
  if (F.showMonthlyPayments) head += "<th>Monthly payment</th>";
  head += "</tr>";
  t.appendChild(el("thead", null, head));

  var tb = el("tbody");
  rows.forEach(function (row) {
    var p = row.plan, pay = row.pay;
    var tr = el("tr", p.id === S.plan[offer.id] ? "sel" : null);
    var cells = "<td>" + esc(row.name) + "</td>";
    if (F.showTerm) cells += "<td>" + (p.term || "—") + "</td>";
    if (F.showRate) cells += "<td>" + (p.method === "TERM_AND_INTEREST_RATE" ? p.rate + "%" : "—") + "</td>";
    if (F.showMonthlyPayments) cells += '<td class="pay">' + (payText(pay) ? esc(payText(pay)) : "—") + "</td>";
    tr.innerHTML = cells;
    /* The whole row is the control. Tapping a small link in the last column
       is a poor target on a tablet held at arm's length across a table. */
    tr.setAttribute("role", "button");
    tr.setAttribute("tabindex", "0");
    tr.addEventListener("click", function () {
      S.plan[offer.id] = p.id;
      renderStage();
      openFinancing(offer);
    });
    tr.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tr.click(); }
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  box.appendChild(t);
  if (F.disclaimer) box.appendChild(el("div", "hint", esc(F.disclaimer)));
  openModal("finModal");
}

/* ============================================================
   6. Price inputs
   ============================================================ */
function renderInputs() {
  var box = $("inputsBody");
  box.innerHTML = "";

  CONFIG.priceInputs.forEach(function (pi) {
    if (!pi.enabled) return;
    box.appendChild(moneyField(pi.label, S.inputs[pi.id], function (v) { S.inputs[pi.id] = v; refreshTotals(); }));
  });
  box.appendChild(moneyField(CONFIG.page.priceAdjustmentLabel, S.deposit, function (v) { S.deposit = v; refreshTotals(); }));

  var tr = el("div", "totrow");
  var c1 = el("div"); c1.appendChild(el("div", "k", "Project Total")); c1.appendChild(el("div", "v", "", ""));
  c1.lastChild.className = "v"; c1.lastChild.id = "sumTotal";
  var c2 = el("div"); c2.appendChild(el("div", "k", "Financed Total"));
  var v2 = el("div", "v"); v2.id = "sumFinanced"; c2.appendChild(v2);
  tr.appendChild(c1); tr.appendChild(c2);
  box.appendChild(tr);
  refreshTotals();
}

function moneyField(label, value, onChange) {
  var f = el("div", "field");
  f.appendChild(el("label", null, esc(label)));
  var w = el("div", "wrap");
  w.appendChild(el("span", "pre", "$"));
  var inp = document.createElement("input");
  inp.type = "text";
  inp.inputMode = "decimal";
  inp.value = value ? String(value) : "0";
  inp.addEventListener("focus", function () { inp.select(); });
  inp.addEventListener("input", function () {
    var n = parseFloat(String(inp.value).replace(/[^0-9.]/g, ""));
    onChange(isNaN(n) ? 0 : n);
  });
  inp.addEventListener("blur", function () { if (inp.value.trim() === "") { inp.value = "0"; onChange(0); } });
  w.appendChild(inp);
  f.appendChild(w);
  return f;
}

function refreshTotals() {
  var base = baseTotal();
  var st = $("sumTotal"), sf = $("sumFinanced");
  if (st) st.textContent = money(base);
  if (sf) sf.textContent = money(Math.max(base - Number(S.deposit || 0), 0));
  renderStage();
}

/* ============================================================
   7. Pricing drawer
   ============================================================ */
function renderDrawer() {
  var box = $("drawerBody");
  box.innerHTML = "";

  /* Rep-facing only. Confirms the quote came back, and shows when it was
     saved so a sit left over from an earlier appointment is obvious. */
  if (S.restoredAt) {
    var when = new Date(S.restoredAt);
    box.appendChild(el("div", "sit-note",
      "Picked up where you left off. Saved at " +
      when.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + "."));
  }

  // Prices
  var g0 = el("div", "grp");
  g0.appendChild(el("div", "lbl", "Prices"));
  var pbtn = el("button", "ghost-btn", "Enter project prices &amp; " + esc(CONFIG.page.priceAdjustmentLabel.toLowerCase()));
  pbtn.style.width = "100%";
  pbtn.addEventListener("click", function () { renderInputs(); openModal("inputsModal"); });
  g0.appendChild(pbtn);
  box.appendChild(g0);

  /* Costco Shop Card. Not a discount, so it lives outside CONFIG.discounts.
     Placed first, ahead of every discount toggle, because it changes which
     promotion applies (see below) rather than stacking with one, and most
     homeowners are not Costco members, so a rep needs to see and decide
     this before touching anything else. */

  var used = {};
  CONFIG.offers.forEach(function (o) { o.discounts.forEach(function (id) { used[id] = true; }); });

      .map(function (o) { return o.title; });
    row.appendChild(el("div", "hint",

}

/* Self-contained SHA-256. crypto.subtle is unavailable in non-secure
   contexts, and an Ingage webview is not guaranteed to be one. */
function sha256(str) {
  var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
           0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
           0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
           0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
           0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
           0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
           0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
           0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

  // UTF-8 encode
  var bytes = [];
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c < 0x80) bytes.push(c);
    else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 0xd800 || c >= 0xe000) bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else { i++; var cp = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
           bytes.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63)); }
  }

  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (var b = 7; b >= 0; b--) bytes.push((b < 4 ? Math.floor(bitLen / Math.pow(2, 8 * b)) : 0) & 0xff);

  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }

  for (var off = 0; off < bytes.length; off += 64) {
    for (var t = 0; t < 16; t++) {
      w[t] = (bytes[off + t * 4] << 24) | (bytes[off + t * 4 + 1] << 16) | (bytes[off + t * 4 + 2] << 8) | bytes[off + t * 4 + 3];
    }
    for (t = 16; t < 64; t++) {
      var s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      var s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
    }
    var a = H[0], bb = H[1], c2 = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (t = 0; t < 64; t++) {
      var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K[t] + w[t]) | 0;
      var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      var mj = (a & bb) ^ (a & c2) ^ (bb & c2);
      var t2 = (S0 + mj) | 0;

    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + bb) | 0; H[2] = (H[2] + c2) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;

}

function openAdmin() {
  if (adminUnlocked) { DRAFT = DRAFT || clone(CONFIG); renderAdmin(); openModal("adminModal"); return; }
  renderGate();
  openModal("adminModal");
}

function renderGate() {
  $("adminHeading").textContent = CONFIG.security.adminHash ? "Administrator sign in" : "Set an administrator password";
  $("adminFooter").classList.add("hidden");
  $("adminLock").classList.add("hidden");
  var box = $("adminBody");
  box.innerHTML = "";

  if (!CONFIG.security.adminHash) {
    box.appendChild(el("div", "warn",
      "No administrator password is set on this file yet. Choose one now, then use <strong>Export configured HTML</strong> to write a copy that carries it. " +
      "The password is stored as a SHA-256 hash, so it is not readable in the file. Be clear-eyed about what that buys you: it keeps reps out of the settings, but anyone who can edit the HTML can remove the gate. It is a lock on a cabinet, not a vault."));
  }

  var f1 = el("div", "field");
  f1.appendChild(el("label", null, "Password"));
  var w1 = el("div", "wrap");
  var p1 = document.createElement("input"); p1.type = "password"; p1.autocomplete = "off";
  w1.appendChild(p1); f1.appendChild(w1); box.appendChild(f1);

  var p2 = null;
  if (!CONFIG.security.adminHash) {
    var f2 = el("div", "field");
    f2.appendChild(el("label", null, "Confirm password"));
    var w2 = el("div", "wrap");
    p2 = document.createElement("input"); p2.type = "password"; p2.autocomplete = "off";
    w2.appendChild(p2); f2.appendChild(w2); box.appendChild(f2);
  }

  var err = el("div", "err"); box.appendChild(err);
  var go = el("button", "solid-btn", CONFIG.security.adminHash ? "Unlock" : "Set password");
  go.addEventListener("click", submit);
  p1.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  if (p2) p2.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  box.appendChild(go);
  setTimeout(function () { p1.focus(); }, 60);

  function submit() {
    err.textContent = "";
    var v = p1.value;
    if (!v) { err.textContent = "Enter a password."; return; }
    if (!CONFIG.security.adminHash) {
      if (v.length < 6) { err.textContent = "Use at least 6 characters."; return; }
      if (v !== p2.value) { err.textContent = "The two passwords do not match."; return; }
      CONFIG.security.adminHash = sha256(v);
      adminUnlocked = true;
      DRAFT = clone(CONFIG);
      renderAdmin();
      return;
    }
    var h = sha256(v);
    if (h !== CONFIG.security.adminHash) { err.textContent = "That password is not correct."; return; }
    adminUnlocked = true;
    DRAFT = clone(CONFIG);
    renderAdmin();
  }
}

function editRow(label, value, onChange, type, options) {
  var d = el("div");
  d.appendChild(el("label", null, esc(label)));
  var inp;
  if (type === "select") {
    inp = document.createElement("select");
    options.forEach(function (o) {
      var op = document.createElement("option");
      op.value = o[0]; op.textContent = o[1];
      if (String(o[0]) === String(value)) op.selected = true;
      inp.appendChild(op);
    });
    inp.addEventListener("change", function () { onChange(inp.value); });
  } else {
    inp = document.createElement("input");
    inp.type = type === "number" ? "number" : "text";
    if (type === "number") inp.step = "any";
    inp.value = value == null ? "" : value;
    inp.addEventListener("input", function () {
      onChange(type === "number" ? (parseFloat(inp.value) || 0) : inp.value);
    });
  }
  d.appendChild(inp);
  return d;
}

/* ============================================================
   9. Export
   ============================================================ */
function serializeConfig(cfg) {
  return JSON.stringify(cfg, null, 2).replace(/</g, "\\u003c");
}

function buildExportHtml() {
  CONFIG = clone(DRAFT);
  applyTheme();
  resetSession();
  renderDrawer();
  renderStage();

  var start = PRISTINE_HTML.indexOf("/*PK_CONFIG_START*/");
  var end = PRISTINE_HTML.indexOf("/*PK_CONFIG_END*/");
  if (start < 0 || end < 0) { alert("Could not locate the configuration block. Nothing was saved."); return null; }

  return PRISTINE_HTML.slice(0, start + "/*PK_CONFIG_START*/".length) +
    "\n" + serializeConfig(CONFIG) + "\n" +
    PRISTINE_HTML.slice(end);
}

function download(blob, filename) {
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
}

function exportHtml() {
  clearSit();
  clearLayoutLocal();
  var out = buildExportHtml();
  if (out === null) return;
  download(new Blob([out], { type: "text/html" }), "index.html");
  clearDirty();
  setStatus("Saved as index.html. Zip it before uploading to Ingage, or use the .zip button instead.");
}

/* ---- Ingage package ----------------------------------------------------
   Ingage wants a zip with index.html at its root. Producing it here saves a
   rename-and-compress round trip that is easy to get wrong, and the file
   only ever needs storing, never compressing, so no library is required. */
function crc32(bytes) {
  var table = crc32.table;
  if (!table) {
    table = crc32.table = new Int32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c;
    }
  }
  var crc = -1;
  for (var i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ -1) >>> 0;
}

function buildZip(name, text) {
  var enc = new TextEncoder();
  var data = enc.encode(text);
  var nameBytes = enc.encode(name);
  var crc = crc32(data);
  var d = new Date();
  var dosTime = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  var dosDate = ((((d.getFullYear() - 1980) & 0x7F) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;

  function u16(v) { return [v & 255, (v >>> 8) & 255]; }
  function u32(v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }

  var local = [].concat([0x50, 0x4b, 0x03, 0x04], u16(20), u16(0x0800), u16(0),
    u16(dosTime), u16(dosDate), u32(crc), u32(data.length), u32(data.length),
    u16(nameBytes.length), u16(0));
  var central = [].concat([0x50, 0x4b, 0x01, 0x02], u16(20), u16(20), u16(0x0800), u16(0),
    u16(dosTime), u16(dosDate), u32(crc), u32(data.length), u32(data.length),
    u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(0));

  var localLen = local.length + nameBytes.length + data.length;
  var centralLen = central.length + nameBytes.length;
  var end = [].concat([0x50, 0x4b, 0x05, 0x06], u16(0), u16(0), u16(1), u16(1),
    u32(centralLen), u32(localLen), u16(0));

  var out = new Uint8Array(localLen + centralLen + end.length);
  var o = 0;
  function push(arr) { out.set(arr, o); o += arr.length; }
  push(new Uint8Array(local)); push(nameBytes); push(data);
  push(new Uint8Array(central)); push(nameBytes);
  push(new Uint8Array(end));
  return new Blob([out], { type: "application/zip" });
}

function exportZip() {
  clearSit();
  clearLayoutLocal();
  var out = buildExportHtml();
  if (out === null) return;
  download(buildZip("index.html", out), "investment-guide-ingage.zip");
  clearDirty();
  setStatus("Saved as investment-guide-ingage.zip, ready to upload to Ingage as is.");
}

/* ============================================================
   10. Modals + wiring
   ============================================================ */
function openModal(id) { $(id).classList.add("on"); }
function closeModal(id) { $(id).classList.remove("on"); }

document.addEventListener("click", function (e) {
  if (!e.target.closest) return;
  var m = e.target.closest("[data-close-modal]");
  if (m) closeModal(m.getAttribute("data-close-modal"));
  if (e.target.closest("[data-close-drawer]")) closeDrawer();
});
document.querySelectorAll(".modal").forEach(function (m) {
  m.addEventListener("click", function (e) { if (e.target === m) m.classList.remove("on"); });
});

function openDrawer() { renderDrawer(); $("drawer").classList.add("on"); $("scrim").classList.add("on"); }
function closeDrawer() { $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); }

$("openDrawer").addEventListener("click", openDrawer);
$("scrim").addEventListener("click", closeDrawer);
$("resetSession").addEventListener("click", function () {
  clearSit(); resetSession(); renderDrawer(); renderStage();
  setStatus("");
});
$("openAdmin").addEventListener("click", function () { closeDrawer(); openAdmin(); });
["input", "change"].forEach(function (evt) {
  $("adminBody").addEventListener(evt, markDirty);
});
$("adminLock").addEventListener("click", function () {
  if (adminDirty && !confirm("These changes have not been saved to a file. Lock anyway and lose them?")) return;
  adminUnlocked = false; DRAFT = null; clearDirty(); closeModal("adminModal");
});
$("revertBtn").addEventListener("click", function () {
  DRAFT = clone(CONFIG); clearDirty(); renderAdmin(); setStatus("Reverted to the loaded configuration.");
});
$("exportBtn").addEventListener("click", exportZip);
$("exportHtmlBtn").addEventListener("click", exportHtml);

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    document.querySelectorAll(".modal.on").forEach(function (m) { m.classList.remove("on"); });
    closeDrawer();
  }
  if (e.ctrlKey && e.shiftKey && (e.key === "A" || e.key === "a")) { e.preventDefault(); openAdmin(); }
});
